<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR 实验</title></head><body><h1>本地 OCR 实验</h1><p>不会上传图片或保存卡片。模型首次下载较大。</p><input id="image" type="file" accept="image/*"><button id="run">测试 PaddleOCR</button><pre id="status">待测试</pre><pre id="result"></pre><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script><script src="https://docs.opencv.org/4.8.0/opencv.js"></script><script type="module">
import * as Paddle from 'https://cdn.jsdelivr.net/npm/esearch-ocr@5.1.5/dist/esearch-ocr.js';
const $=id=>document.getElementById(id);$('run').onclick=async()=>{try{const file=$('image').files[0];if(!file)throw Error('先选择图片');$('run').disabled=true;$('status').textContent='加载 OpenCV 与 OCR 模型…';for(let i=0;i<60&&!window.cv?.Mat;i++)await new Promise(r=>setTimeout(r,500));if(!window.cv?.Mat)throw Error('OpenCV 未加载');const assets='https://cdn.jsdelivr.net/npm/paddleocr-browser@1.0.4/dist/';const response=await fetch(assets+'ppocr_keys_v1.txt');if(!response.ok)throw Error('字典下载失败');await Paddle.init({detPath:assets+'ppocr_det.onnx',recPath:assets+'ppocr_rec.onnx',dic:await response.text(),ort:window.ort,node:false,cv:window.cv});$('status').textContent='正在识别…';const url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const result=await Paddle.ocr(url);$('result').textContent=JSON.stringify(result,null,2);$('status').textContent='识别完成'}catch(e){$('status').textContent='失败：'+(e.stack||e)}finally{$('run').disabled=false}};
</script></body></html>
