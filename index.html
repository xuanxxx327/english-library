<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e37"><link rel="manifest" href="manifest.webmanifest"><title>English Library</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#1a302a;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}header{background:#173e37;color:white;padding:26px 18px}header>div,main{max-width:820px;margin:auto}h1{margin:0;font-size:28px}header p{opacity:.8;margin:5px 0}main{padding:16px}button,.btn{border:0;border-radius:10px;padding:11px 14px;background:#276e57;color:white;font:inherit;cursor:pointer}button.secondary{background:#e4eee8;color:#24533f}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 20px}.card{background:white;border:1px solid #dfe6df;border-radius:16px;overflow:hidden;margin-bottom:18px}.card img{width:100%;display:block}.body{padding:17px}.meta{color:#61766b;font-size:13px}.en{font-size:20px;line-height:1.6}.zh{font-size:17px;color:#52665a}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}audio{width:100%;margin:12px 0}dialog{border:0;border-radius:18px;padding:22px;width:min(95vw,560px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0008}label{display:block;margin:12px 0 4px;font-weight:600}input,textarea,select{font:inherit;padding:10px;width:100%;border:1px solid #cbd7cd;border-radius:8px}textarea{min-height:90px}.note{font-size:13px;color:#6c776e}#empty{padding:40px;text-align:center;color:#60766b}</style></head><body><header><div><h1>📚 English Library</h1><p>我的英语截图 · 朗读 · 翻译资料库</p></div></header><main><div class="toolbar"><button onclick="edit()">＋ 添加截图</button><button class="secondary" onclick="backup()">导出备份</button><button class="secondary" onclick="document.getElementById('restore').click()">导入备份</button><input id="restore" type="file" accept="application/json" hidden onchange="restoreFile(event)"></div><p class="note">资料保存在当前浏览器中。换设备或清理浏览器数据前，请先“导出备份”。上传的图片和音频也会包含在备份中。</p><div id="cards"></div></main><dialog id="editor"><form id="form"><h2 id="formtitle">添加学习卡片</h2><input id="rowid" type="hidden"><label>课程名称</label><input id="lesson" value="Peppa Pig · 第1课" required><label>英语截图</label><input id="pic" type="file" accept="image/*"><label>英文原文</label><textarea id="en" required></textarea><label>中文翻译</label><textarea id="zh" required></textarea><label>英文音频（可选，mp3 等）</label><input id="sound" type="file" accept="audio/*"><p class="note">没有音频时可使用设备的英文语音朗读（需浏览器支持）。</p><div class="actions"><button type="submit">保存</button><button type="button" class="secondary" onclick="editor.close()">取消</button></div></form></dialog><script>
let db,items=[];const $=id=>document.getElementById(id);function tx(mode='readonly'){return db.transaction('cards',mode).objectStore('cards')};function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})};async function init(){db=await new Promise((ok,no)=>{let r=indexedDB.open('english-library-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('cards',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});items=await req(tx().getAll());if(!items.length){try{let initial=await (await fetch('starter.json')).json();for(let x of initial){x.image=await (await fetch(x.image)).blob();x.audio=await (await fetch(x.audio)).blob();await req(tx('readwrite').put(x))}items=await req(tx().getAll())}catch(e){console.warn('初始化示例数据失败',e)}}render()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let urls=[];function url(b){if(!(b instanceof Blob))return '';let u=URL.createObjectURL(b);urls.push(u);return u};function render(){urls.forEach(URL.revokeObjectURL);urls=[];let root=$('cards');root.innerHTML=items.length?'':'<div id="empty">还没有学习卡片，点击上方添加。</div>';items.sort((a,b)=>a.id-b.id).forEach((x,i)=>{let div=document.createElement('article');div.className='card';div.innerHTML=`${x.image?`<img src="${url(x.image)}" alt="学习截图">`:''}<div class="body"><div class="meta">${esc(x.lesson)} · ${i+1}</div><p class="en">${esc(x.en)}</p>${x.audio?`<audio controls preload="none" src="${url(x.audio)}"></audio>`:`<button class="secondary" data-speak="${x.id}">🔊 朗读英文</button>`}<p class="zh">${esc(x.zh)}</p><div class="actions"><button class="secondary" data-edit="${x.id}">编辑</button><button class="secondary" data-delete="${x.id}">删除</button></div></div>`;root.append(div)});root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(+b.dataset.edit));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(+b.dataset.delete));root.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{let x=items.find(v=>v.id==b.dataset.speak);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.en);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)})}
function edit(id){$('form').reset();$('rowid').value=id||'';let x=items.find(v=>v.id===id);$('formtitle').textContent=x?'编辑学习卡片':'添加学习卡片';$('lesson').value=x?.lesson||'Peppa Pig · 第1课';$('en').value=x?.en||'';$('zh').value=x?.zh||'';$('editor').showModal()};$('form').onsubmit=async e=>{e.preventDefault();let id=+$('rowid').value||Date.now(),old=items.find(x=>x.id===id)||{};let x={...old,id,lesson:$('lesson').value,en:$('en').value,zh:$('zh').value};if($('pic').files[0])x.image=$('pic').files[0];if($('sound').files[0])x.audio=$('sound').files[0];await req(tx('readwrite').put(x));items=await req(tx().getAll());$('editor').close();render()};async function del(id){if(!confirm('确定删除这张卡片吗？'))return;await req(tx('readwrite').delete(id));items=await req(tx().getAll());render()};function blob64(b){return new Promise(ok=>{let r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)})};async function backup(){let data=[];for(let x of items){let y={...x};for(let f of ['image','audio'])if(y[f] instanceof Blob)y[f]=await blob64(y[f]);data.push(y)}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='English-Library-备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}async function restoreFile(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error('备份格式不正确');if(!confirm('导入将替换当前全部卡片。确定继续？'))return;await req(tx('readwrite').clear());for(let x of data){for(let field of ['image','audio'])if(typeof x[field]==='string'&&x[field].startsWith('data:')){let res=await fetch(x[field]);x[field]=await res.blob()}await req(tx('readwrite').put(x))}items=await req(tx().getAll());render();alert('导入完成')}catch(err){alert('导入失败：'+err.message)}e.target.value=''}init();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(console.warn);
</script></body></html>
